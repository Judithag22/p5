<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitectura escuela</title>

    <style>
        body {
            font-size: 16px;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .esquema {
            position: relative;
            width: 1174px;
            height: 895px;
            margin: 60px auto;
        }

        .escalera3 {
            position: absolute;
            left: 401px;
            top: 0;
            width: 768px;
            height: 252px;
            background-color: #d071bf;
        }

        .barandilla {
            position: absolute;
            left: 0;
            top: 274px;
            width: 759px;
            height: 78px;
            background-color: #f46f7d;
        }

        .escalera2 {
            position: absolute;
            left: 5px;
            top: 377px;
            width: 753px;
            height: 518px;
            background-color: #d071bf;
        }

        .suelo {
            position: absolute;
            left: 786px;
            top: 305px;
            width: 388px;
            height: 590px;
            background-color: #7e87d6;
        }

        p {
            font-size: 2em;
            margin: 10px;
            color: black;
        }
    </style>
</head>

<body>

    <div class="esquema">

        <div class="escalera3">
            <p>Escalera -3</p>
        </div>

        <div class="barandilla">
            <p>Barandilla</p>
        </div>

        <div class="escalera2">
            <p>Escalera -2</p>
        </div>

        <div class="suelo">
            <p>Suelo</p>
        </div>

    </div>

</body>
</html>
